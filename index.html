<!DOCTYPE html>
<html>
<head>
    <title>AI Phishing Trainer</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        .container{
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        .email-box{
            background: #eef3ff;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: left;
        }

        button{
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #result{
            margin-top: 20px;
            font-weight: bold;
        }

        #score{
            font-size: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Phishing Trainer</h1>

    <p>
        Practice identifying phishing emails and improve your cybersecurity awareness.
    </p>

    <div id="score">
        Score: 0
    </div>

    <div class="email-box" id="email">
        Click Start Training to begin.
    </div>

    <br>

    <button onclick="startTraining()">Start Training</button>

    <button onclick="checkAnswer('safe')">
        Safe
    </button>

    <button onclick="checkAnswer('phishing')">
        Phishing
    </button>

    <div id="result"></div>

</div>

<script>

let score = 0;
let currentAnswer = "";

const emails = [

{
text:
"From: security@your-bank.com\n\nYour account has been locked. Click here immediately to verify your password.",
answer: "phishing"
},

{
text:
"From: teacher@school.edu\n\nReminder: Assignment is due on Friday.",
answer: "safe"
},

{
text:
"From: support@amaz0n-login.com\n\nYour account will be suspended unless you verify now.",
answer: "phishing"
},

{
text:
"From: library@college.edu\n\nThe library will close at 5 PM today.",
answer: "safe"
}

];

function startTraining(){

let randomEmail =
emails[Math.floor(Math.random() * emails.length)];

document.getElementById("email").innerText =
randomEmail.text;

currentAnswer = randomEmail.answer;

document.getElementById("result").innerText = "";

}

function checkAnswer(userAnswer){

if(currentAnswer === ""){
return;
}

if(userAnswer === currentAnswer){

score++;

document.getElementById("result").innerText =
"✅ Correct!";

}else{

document.getElementById("result").innerText =
"❌ Incorrect. Be careful with suspicious emails.";

}

document.getElementById("score").innerText =
"Score: " + score;

}

</script>

</body>
</html>
